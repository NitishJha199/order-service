name: Order Service CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Tests
        run: |
          python3 -m unittest test_app.py

  build-and-telemetry:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Artifact Tag
        id: meta
        run: echo "IMAGE_TAG=${{ github.repository }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Emit Supply-Chain Telemetry to CodeDNA
        run: |
          # 1. Send push event telemetry to the webhook engine
          curl -s --connect-timeout 10 --max-time 15 -X POST http://52.203.54.1:8000/webhooks/github \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}" \
            -d '{
              "repository": {
                "id": ${{ github.repository_id }},
                "name": "${{ github.event.repository.name }}",
                "full_name": "${{ github.repository }}",
                "owner": {
                  "login": "${{ github.repository_owner }}"
                }
              },
              "head_commit": {
                "id": "${{ github.sha }}",
                "message": "${{ github.event.head_commit.message }}",
                "author": { "name": "${{ github.actor }}" }
              },
              "ref": "${{ github.ref }}"
            }' || echo "Webhook telemetry step failed or timed out"

          # 2. Register live deployment status
          curl -s --connect-timeout 10 --max-time 15 -X POST http://52.203.54.1:8000/deployments \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "provider": "github_actions",
              "external_id": "${{ github.run_id }}"
            }' || echo "Deployment registration step failed or timed out"
