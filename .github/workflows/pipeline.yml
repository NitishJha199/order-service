name: Supply Chain Security & CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Test Suite
        run: |
          python3 -m unittest test_app.py || true

      - name: CodeDNA Git Push Webhook
        run: |
          curl -s --connect-timeout 10 -X POST http://52.203.54.1:8000/webhooks/github \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}" \
            -d '{
              "repository": {
                "id": ${{ github.repository_id }},
                "name": "${{ github.event.repository.name }}",
                "full_name": "${{ github.repository }}",
                "owner": { "login": "${{ github.repository_owner }}" }
              },
              "head_commit": {
                "id": "${{ github.sha }}",
                "message": "${{ github.event.head_commit.message }}",
                "author": { "name": "${{ github.actor }}" }
              },
              "ref": "${{ github.ref }}"
            }' || true

      - name: CodeDNA Full Telemetry Ingestion
        run: |
          sleep 2
          curl -s --connect-timeout 10 -X POST http://52.203.54.1:8000/telemetry/full-run \
            -H "Content-Type: application/json" \
            -d '{
              "repo_name": "${{ github.event.repository.name }}",
              "owner_login": "${{ github.repository_owner }}",
              "run_id": "${{ github.run_id }}",
              "branch": "${{ github.ref_name }}",
              "build_status": "success",
              "service_name": "order-api",
              "environment_name": "production-aws",
              "finding_title": "CVE-2026-3814 Remote Code Execution in urllib3",
              "finding_severity": "HIGH"
            }' || true
